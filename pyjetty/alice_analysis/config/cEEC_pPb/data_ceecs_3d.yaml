# Configuration for intermediary TTree processing into final analysis output objects

targets: 
  - E2C_T_jj
  - E2C_P_jj
  - E2C_M_jj
  - E2C_PM_jj
  - E2C_T_jp
  - E2C_P_jp
  - E2C_M_jp
  - E2C_PM_jp
  - E2C_T_pp
  - E2C_P_pp
  - E2C_M_pp
  - E2C_PM_pp
  - E2C_T_mx
  - E2C_P_mx
  - E2C_M_mx
  - E2C_PM_mx
  - jet_pt

jetR: 0.4

bins:
  pT_bins: ['c', [5, 10, 20, 40, 60, 80, 100, 150]]
  RL_bins: ['log', 0.008, 1, 10]
  ew_bins: ['log', 3.0e-5, 1, 8]

rules:
  cEEC:
    params:
      ptcut:
        - 1.0
    dir:
      - [f, pT1 > ptcut && pT2 > ptcut]
    cEEC:
      tree: pairs
      jj:
        dir:
          - [f, id1 == 0 && id2 == 0]
        E2C_T_jj:
          dir:
            - [h, 3, "eec T;ew;R_{L};jet pt", ew_bins, RL_bins, pT_bins, weight, RL, pTjetsub]
        E2C_P_jj:
          dir:
            - [f, q1 > 0 && q2 > 0]
            - [h, 3, "eec P;ew;R_{L};jet pt", ew_bins, RL_bins, pT_bins, weight, RL, pTjetsub]
        E2C_M_jj:
          dir:
            - [f, q1 < 0 && q2 < 0]
            - [h, 3, "eec M;ew;R_{L};jet pt", ew_bins, RL_bins, pT_bins, weight, RL, pTjetsub]
        E2C_PM_jj:
          dir:
            - [f, (q1 * q2) < 0]
            - [h, 3, "eec PM;ew;R_{L};jet pt", ew_bins, RL_bins, pT_bins, weight, RL, pTjetsub]
      jp:
        dir:
          - [f, (id1 == 0 && id2 != 0) || (id1 != 0 && id2 == 0)]
        E2C_T_jp:
          dir:
            - [h, 3, "eec T;ew;R_{L};jet pt", ew_bins, RL_bins, pT_bins, weight, RL, pTjetsub]
        E2C_P_jp:
          dir:
            - [f, q1 > 0 && q2 > 0]
            - [h, 3, "eec P;ew;R_{L};jet pt", ew_bins, RL_bins, pT_bins, weight, RL, pTjetsub]
        E2C_M_jp:
          dir:
            - [f, q1 < 0 && q2 < 0]
            - [h, 3, "eec M;ew;R_{L};jet pt", ew_bins, RL_bins, pT_bins, weight, RL, pTjetsub]
        E2C_PM_jp:
          dir:
            - [f, (q1 * q2) < 0]
            - [h, 3, "eec PM;ew;R_{L};jet pt", ew_bins, RL_bins, pT_bins, weight, RL, pTjetsub]
      pp:
        dir:
          - [f, (id1 > 0 && id2 > 0) || (id1 < 0 && id2 < 0)]
        E2C_T_pp:
          dir:
            - [h, 3, "eec T;ew;R_{L};jet pt", ew_bins, RL_bins, pT_bins, weight, RL, pTjetsub]
        E2C_P_pp:
          dir:
            - [f, q1 > 0 && q2 > 0]
            - [h, 3, "eec P;ew;R_{L};jet pt", ew_bins, RL_bins, pT_bins, weight, RL, pTjetsub]
        E2C_M_pp:
          dir:
            - [f, q1 < 0 && q2 < 0]
            - [h, 3, "eec M;ew;R_{L};jet pt", ew_bins, RL_bins, pT_bins, weight, RL, pTjetsub]
        E2C_PM_pp:
          dir:
            - [f, (q1 * q2) < 0]
            - [h, 3, "eec PM;ew;R_{L};jet pt", ew_bins, RL_bins, pT_bins, weight, RL, pTjetsub]
      mx:
        dir:
          - [f, (id1 > 0 && id2 < 0) || (id1 < 0 && id2 > 0)]
        E2C_T_mx:
          dir:
            - [h, 3, "eec T;ew;R_{L};jet pt", ew_bins, RL_bins, pT_bins, weight, RL, pTjetsub]
        E2C_P_mx:
          dir:
            - [f, q1 > 0 && q2 > 0]
            - [h, 3, "eec P;ew;R_{L};jet pt", ew_bins, RL_bins, pT_bins, weight, RL, pTjetsub]
        E2C_M_mx:
          dir:
            - [f, q1 < 0 && q2 < 0]
            - [h, 3, "eec M;ew;R_{L};jet pt", ew_bins, RL_bins, pT_bins, weight, RL, pTjetsub]
        E2C_PM_mx:
          dir:
            - [f, (q1 * q2) < 0]
            - [h, 3, "eec PM;ew;R_{L};jet pt", ew_bins, RL_bins, pT_bins, weight, RL, pTjetsub]
  jetpt:
    tree: jets
    jet_pt:
      dir:
        - [h, 1, det jet pt;jet pt;cts, pT_bins, pTsub]