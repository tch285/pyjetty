# Configuration for intermediary TTree processing into final analysis output objects

targets:
  - E2C_T_jj
  - E2C_Q_jj
  - E2C_P_jj
  - E2C_M_jj
  - E2C_PM_jj
  - E2C_T_jp_P
  - E2C_Q_jp_P
  - E2C_P_jp_P
  - E2C_M_jp_P
  - E2C_PM_jp_P
  - E2C_T_pp_P
  - E2C_Q_pp_P
  - E2C_P_pp_P
  - E2C_M_pp_P
  - E2C_PM_pp_P
  - E2C_T_jp_M
  - E2C_Q_jp_M
  - E2C_P_jp_M
  - E2C_M_jp_M
  - E2C_PM_jp_M
  - E2C_T_pp_M
  - E2C_Q_pp_M
  - E2C_P_pp_M
  - E2C_M_pp_M
  - E2C_PM_pp_M
  - E2C_T_mx
  - E2C_Q_mx
  - E2C_P_mx
  - E2C_M_mx
  - E2C_PM_mx
  - jet_pt

jetR: 0.4

bins:
  pT_bins: ['lin', 0, 200, 200]
  RL_bins: ['log', 1.0e-2, 0.4, 20]

rules:
  cEEC:
    params:
      ptcut:
        # - 0.15
        # - 0.5
        - 1.0
        # - 2.0
    dir:
      - [f, pT1 > ptcut && pT2 > ptcut]
    cEEC:
      tree: pairs
      jj:
        dir:
          - [f, id1 == 0 && id2 == 0]
        E2C_T_jj:
          dir:
            - [h, 2, "eec T;jet pt;R_{L}", pT_bins, RL_bins, pTjetsub, RL, weight]
        E2C_Q_jj:
          dir:
            - [d, qw, q1 * q2 * weight]
            - [h, 2, "eec Q;jet pt;R_{L}", pT_bins, RL_bins, pTjetsub, RL, qw]
        E2C_P_jj:
          dir:
            - [f, q1 > 0 && q2 > 0]
            - [h, 2, "eec P;jet pt;R_{L}", pT_bins, RL_bins, pTjetsub, RL, weight]
        E2C_M_jj:
          dir:
            - [f, q1 < 0 && q2 < 0]
            - [h, 2, "eec M;jet pt;R_{L}", pT_bins, RL_bins, pTjetsub, RL, weight]
        E2C_PM_jj:
          dir:
            - [f, (q1 * q2) < 0]
            - [h, 2, "eec PM;jet pt;R_{L}", pT_bins, RL_bins, pTjetsub, RL, weight]
      jp_P:
        dir:
          - [f, (id1 == 0 && id2 > 0) || (id1 > 0 && id2 == 0)]
        E2C_T_jp_P:
          dir:
            - [h, 2, "eec T;jet pt;R_{L}", pT_bins, RL_bins, pTjetsub, RL, weight]
        E2C_Q_jp_P:
          dir:
            - [d, qw, q1 * q2 * weight]
            - [h, 2, "eec Q;jet pt;R_{L}", pT_bins, RL_bins, pTjetsub, RL, qw]
        E2C_P_jp_P:
          dir:
            - [f, q1 > 0 && q2 > 0]
            - [h, 2, "eec P;jet pt;R_{L}", pT_bins, RL_bins, pTjetsub, RL, weight]
        E2C_M_jp_P:
          dir:
            - [f, q1 < 0 && q2 < 0]
            - [h, 2, "eec M;jet pt;R_{L}", pT_bins, RL_bins, pTjetsub, RL, weight]
        E2C_PM_jp_P:
          dir:
            - [f, (q1 * q2) < 0]
            - [h, 2, "eec PM;jet pt;R_{L}", pT_bins, RL_bins, pTjetsub, RL, weight]
      jp_M:
        dir:
          - [f, (id1 == 0 && id2 < 0) || (id1 < 0 && id2 == 0)]
        E2C_T_jp_M:
          dir:
            - [h, 2, "eec T;jet pt;R_{L}", pT_bins, RL_bins, pTjetsub, RL, weight]
        E2C_Q_jp_M:
          dir:
            - [d, qw, q1 * q2 * weight]
            - [h, 2, "eec Q;jet pt;R_{L}", pT_bins, RL_bins, pTjetsub, RL, qw]
        E2C_P_jp_M:
          dir:
            - [f, q1 > 0 && q2 > 0]
            - [h, 2, "eec P;jet pt;R_{L}", pT_bins, RL_bins, pTjetsub, RL, weight]
        E2C_M_jp_M:
          dir:
            - [f, q1 < 0 && q2 < 0]
            - [h, 2, "eec M;jet pt;R_{L}", pT_bins, RL_bins, pTjetsub, RL, weight]
        E2C_PM_jp_M:
          dir:
            - [f, (q1 * q2) < 0]
            - [h, 2, "eec PM;jet pt;R_{L}", pT_bins, RL_bins, pTjetsub, RL, weight]
      pp_P:
        dir:
          - [f, id1 > 0 && id2 > 0]
        E2C_T_pp_P:
          dir:
            - [h, 2, "eec T;jet pt;R_{L}", pT_bins, RL_bins, pTjetsub, RL, weight]
        E2C_Q_pp_P:
          dir:
            - [d, qw, q1 * q2 * weight]
            - [h, 2, "eec Q;jet pt;R_{L}", pT_bins, RL_bins, pTjetsub, RL, qw]
        E2C_P_pp_P:
          dir:
            - [f, q1 > 0 && q2 > 0]
            - [h, 2, "eec P;jet pt;R_{L}", pT_bins, RL_bins, pTjetsub, RL, weight]
        E2C_M_pp_P:
          dir:
            - [f, q1 < 0 && q2 < 0]
            - [h, 2, "eec M;jet pt;R_{L}", pT_bins, RL_bins, pTjetsub, RL, weight]
        E2C_PM_pp_P:
          dir:
            - [f, (q1 * q2) < 0]
            - [h, 2, "eec PM;jet pt;R_{L}", pT_bins, RL_bins, pTjetsub, RL, weight]
      pp_M:
        dir:
          - [f, id1 < 0 && id2 < 0]
        E2C_T_pp_M:
          dir:
            - [h, 2, "eec T;jet pt;R_{L}", pT_bins, RL_bins, pTjetsub, RL, weight]
        E2C_Q_pp_M:
          dir:
            - [d, qw, q1 * q2 * weight]
            - [h, 2, "eec Q;jet pt;R_{L}", pT_bins, RL_bins, pTjetsub, RL, qw]
        E2C_P_pp_M:
          dir:
            - [f, q1 > 0 && q2 > 0]
            - [h, 2, "eec P;jet pt;R_{L}", pT_bins, RL_bins, pTjetsub, RL, weight]
        E2C_M_pp_M:
          dir:
            - [f, q1 < 0 && q2 < 0]
            - [h, 2, "eec M;jet pt;R_{L}", pT_bins, RL_bins, pTjetsub, RL, weight]
        E2C_PM_pp_M:
          dir:
            - [f, (q1 * q2) < 0]
            - [h, 2, "eec PM;jet pt;R_{L}", pT_bins, RL_bins, pTjetsub, RL, weight]
      mx:
        dir:
          - [f, (id1 > 0 && id2 < 0) || (id1 < 0 && id2 > 0)]
        E2C_T_mx:
          dir:
            - [h, 2, "eec T;jet pt;R_{L}", pT_bins, RL_bins, pTjetsub, RL, weight]
        E2C_Q_mx:
          dir:
            - [d, qw, q1 * q2 * weight]
            - [h, 2, "eec Q;jet pt;R_{L}", pT_bins, RL_bins, pTjetsub, RL, qw]
        E2C_P_mx:
          dir:
            - [f, q1 > 0 && q2 > 0]
            - [h, 2, "eec P;jet pt;R_{L}", pT_bins, RL_bins, pTjetsub, RL, weight]
        E2C_M_mx:
          dir:
            - [f, q1 < 0 && q2 < 0]
            - [h, 2, "eec M;jet pt;R_{L}", pT_bins, RL_bins, pTjetsub, RL, weight]
        E2C_PM_mx:
          dir:
            - [f, (q1 * q2) < 0]
            - [h, 2, "eec PM;jet pt;R_{L}", pT_bins, RL_bins, pTjetsub, RL, weight]
  jetpt:
    tree: jets
    jet_pt:
      dir:
        - [h, 1, det jet pt;jet pt;cts, pT_bins, pTsub]