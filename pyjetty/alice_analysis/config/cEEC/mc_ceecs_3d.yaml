targets: 
  - E2C_T_det
  # - E2C_Q_det
  - E2C_P_det
  - E2C_M_det
  - E2C_PM_det
  - E2C_T_gen
  # - E2C_Q_gen
  - E2C_P_gen
  - E2C_M_gen
  - E2C_PM_gen
  - jet_pt_det
  - jet_pt_gen

jetR: 0.4

bins:
  pT_bins: ['c', [5, 10, 20, 40, 60, 80, 100, 150]]
  # RL_bins: ['log', 1.0e-3, 1, 30]
  RL_bins: ['log', 1.0e-2, 0.4, 20]
  # ew_bins: ['log', 1.0e-5, 1, 20]
  ew_bins: ['log', 1.0e-5, 1, 16]

rules:
  cEEC:
    params:
      ptcut:
        - 1.0
    dir:
      - [f, pT1 > ptcut && pT2 > ptcut]
    cEEC_det:
      tree: pairs_det
      E2C_T_det:
        dir:
          - [h, 3, "det eec T;ew;R_{L};jet pt", ew_bins, RL_bins, pT_bins, weight, RL, pTjet]
      # E2C_Q_det:
      #   dir:
      #     - [d, qw, q1 * q2 * weight]
      #     - [h, 3, "det eec Q;ew;R_{L};jet pt", ew_bins, RL_bins, pT_bins, qweight, RL, pTjet]
          # - [h, 2, "det eec Q;jet pt;R_{L}", pT_bins, RL_bins, pTjet, RL, qw]
      E2C_P_det:
        dir:
          - [f, q1 > 0 && q2 > 0]
          - [h, 3, "det eec P;ew;R_{L};jet pt", ew_bins, RL_bins, pT_bins, weight, RL, pTjet]
          # - [h, 2, "det eec P;jet pt;R_{L}", pT_bins, RL_bins, pTjet, RL, weight]
      E2C_M_det:
        dir:
          - [f, q1 < 0 && q2 < 0]
          - [h, 3, "det eec M;ew;R_{L};jet pt", ew_bins, RL_bins, pT_bins, weight, RL, pTjet]
          # - [h, 2, "det eec M;jet pt;R_{L}", pT_bins, RL_bins, pTjet, RL, weight]
      E2C_PM_det:
        dir:
          - [f, (q1 * q2) < 0]
          - [h, 3, "det eec PM;ew;R_{L};jet pt", ew_bins, RL_bins, pT_bins, weight, RL, pTjet]
          # - [h, 2, "det eec PM;jet pt;R_{L}", pT_bins, RL_bins, pTjet, RL, weight]
    cEEC_gen:
      tree: pairs_gen
      E2C_T_gen: 
        dir:
          - [h, 3, "gen eec T;ew;R_{L};jet pt", ew_bins, RL_bins, pT_bins, weight, RL, pTjet]
          # - [h, 2, "gen eec T;jet pt;R_{L}", pT_bins, RL_bins, pTjet, RL, weight]
      # E2C_Q_gen: 
      #   dir:
      #     - [d, qw, q1 * q2 * weight]
      #     - [h, 2, "gen eec Q;jet pt;R_{L}", pT_bins, RL_bins, pTjet, RL, qw]
      E2C_P_gen:
        dir:
          - [f, q1 > 0 && q2 > 0]
          - [h, 3, "gen eec P;ew;R_{L};jet pt", ew_bins, RL_bins, pT_bins, weight, RL, pTjet]
          # - [h, 2, "gen eec P;jet pt;R_{L}", pT_bins, RL_bins, pTjet, RL, weight]
      E2C_M_gen:
        dir:
          - [f, q1 < 0 && q2 < 0]
          - [h, 3, "gen eec M;ew;R_{L};jet pt", ew_bins, RL_bins, pT_bins, weight, RL, pTjet]
          # - [h, 2, "gen eec M;jet pt;R_{L}", pT_bins, RL_bins, pTjet, RL, weight]
      E2C_PM_gen:
        dir:
          - [f, (q1 * q2) < 0]
          - [h, 3, "gen eec PM;ew;R_{L};jet pt", ew_bins, RL_bins, pT_bins, weight, RL, pTjet]
          # - [h, 2, "gen eec PM;jet pt;R_{L}", pT_bins, RL_bins, pTjet, RL, weight]
  jetpt:
    det:
      tree: jets_det
      jet_pt_det:
        dir:
          - [h, 1, det jet pt;jet pt;cts, pT_bins, pT]
    gen:
      tree: jets_gen
      jet_pt_gen:
        dir:
          - [h, 1, gen jet pt;jet pt;cts, pT_bins, pT]